name: Publish package
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Version mismatch! Git tag (v${TAG_VERSION}) does not match package.json (${PACKAGE_VERSION})"
            echo ""
            echo "To fix:"
            echo "  1. Delete this release: gh release delete ${GITHUB_REF_NAME}"
            echo "  2. Delete the tag: git push --delete origin ${GITHUB_REF_NAME}"
            echo "  3. Run 'yarn version' with the correct version"
            echo "  4. Push the tag and re-cut the release"
            exit 1
          fi
          echo "Version validated: ${TAG_VERSION}"

  publish-brew:
    needs: [validate-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # setup-node v4 only caches when `cache` is set, and it isn't here.
      - name: Set up Node # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Pack tarball
        run: npx oclif pack tarballs -t darwin-x64 --no-xz

      - name: Set tarball vars
        id: tarball
        run: |
          FILENAME=$(ls ./dist/*darwin-x64.tar.gz | head -1 | xargs -n 1 basename)
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "download_url=https://github.com/knocklabs/knock-cli/releases/download/${GITHUB_REF_NAME}/${FILENAME}" >> $GITHUB_OUTPUT

      - name: Upload tarball to the release
        run: gh release upload "${GITHUB_REF_NAME}" "./dist/${TARBALL_FILENAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL_FILENAME: ${{ steps.tarball.outputs.filename }}

      # Just to ensure the uploaded tarball is available.
      - run: sleep 10s

      - name: Update brew tap
        uses: mislav/bump-homebrew-formula-action@9d4d820e1d00b99927bd36e67d41fff1cfc8bd07 # v2.4
        if: "!contains(github.ref, '-')" # skip prereleases
        with:
          homebrew-tap: knocklabs/homebrew-tap
          formula-name: knock
          download-url: ${{ steps.tarball.outputs.download_url }}
          create-pullrequest: true
          # IMPORTANT: PR title format needs to be exactly as below so it can be
          # parsed predictively by the homebrew-tap repo.
          commit-message: |
            release: {{formulaName}} {{version}}

            This PR is opened and managed automatically by Github Actions.

            formula: {{formulaName}}
            version: {{version}}
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: [publish-brew]
    # npm's trusted publisher config does not check the branch or tag, so
    # publishing is gated on this environment instead. Its deployment policy
    # allows only the v* release tags, and the npm trusted publisher requires
    # the same environment name.
    environment: production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # setup-node v4 only caches when `cache` is set, and it isn't here. No
      # registry-url either: its placeholder token is what npm falls back to
      # when the OIDC exchange fails, which hides the real error.
      - name: Set up Node # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - run: yarn install --frozen-lockfile --ignore-scripts
      # Publishes through npm trusted publishing (OIDC). Node 26 ships npm 11,
      # which trusted publishing needs.
      - run: npm publish --access public

  notify-release:
    name: Notify release automation
    needs: [publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: POST release tag and repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body \
            --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg repository "$REPOSITORY" \
              '{tag: $tag, repository: $repository}')" \
            "https://api2.cursor.sh/automations/webhook/a0d6eed9-ca3d-11f1-bec7-b2318963e0b6"
